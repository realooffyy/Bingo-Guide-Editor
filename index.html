<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Skyblock.Bingo lets you view your Hypixel Skyblock bingo stats, leaderboard, and guide for this month's goals!" />
		<meta
			name="keywords"
			content="bingo, hypixel, skyblock, hypixel skyblock" />
		<meta name="robots" content="index, follow" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="language" content="English" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
			rel="stylesheet" />

		<!-- <script src="https://skyblock.bingo/MinecraftColorCodes.min.3.7.js"></script> -->

		<title>Bingo Editor</title>
	</head>
	<style>
		body {
			padding: 16px;
			background-color: #070f15;
			font-family: "Atkinson Hyperlegible", sans-serif;
			color: white;
		}

		input {
			background-color: white;
			color: rgb(0, 0, 0);
			border: none;
			border-radius: 30px;
			-webkit-text-size-adjust: 100%;
			tab-size: 4;
			font-family: inherit;
			box-sizing: border-box;
			border-style: solid;
			text-decoration: inherit;
			--tw-bg-opacity: 1;
			border-color: transparent;
			border-radius: 0.5rem;
			border-width: 1px;
			font-weight: 500;
			font-size: 1rem;
			line-height: 1.25;
			padding-top: 0.75rem;
			padding-bottom: 0.75rem;
			padding-left: 1.25rem;
			padding-right: 1.25rem;
			box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
			margin-right: 8px;
			width: calc(25vw - 26px);
		}

		textarea {
			background-color: white;
			color: rgb(0, 0, 0);
			border: none;
			border-radius: 30px;
			-webkit-text-size-adjust: 100%;
			tab-size: 4;
			font-family: inherit;
			box-sizing: border-box;
			border-style: solid;
			text-decoration: inherit;
			--tw-bg-opacity: 1;
			border-color: transparent;
			border-radius: 0.5rem;
			border-width: 1px;
			font-weight: 500;
			font-size: 1rem;
			line-height: 1.25;
			padding-top: 0.75rem;
			padding-bottom: 0.75rem;
			padding-left: 1.25rem;
			padding-right: 1.25rem;
			box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
			margin-right: 8px;
			width: calc(25vw - 26px);
		}

		#add-btn {
			margin-bottom: 16px;
			background-color: white;
			color: rgb(0, 0, 0);
			border-radius: 30px;
			-webkit-text-size-adjust: 100%;
			tab-size: 4;
			font-family: inherit;
			box-sizing: border-box;
			border-style: solid;
			text-decoration: inherit;
			--tw-bg-opacity: 1;
			border-color: transparent;
			border-radius: 0.5rem;
			border-width: 1px;
			font-weight: 500;
			font-size: 1rem;
			line-height: 1.25;
			padding-top: 0.75rem;
			padding-bottom: 0.75rem;
			padding-left: 1.25rem;
			padding-right: 1.25rem;
			box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
			margin-right: 8px;
		}

		.container {
			width: fit-content;
			padding: 8px;
			background-color: white;
			border-radius: 8px;
			display: flex;
			box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
			margin-bottom: 16px;
		}

		button:active {
			transform: scale(0.9);
		}

		.container {
			padding: 8px;
			background-color: white;
			border-radius: 8px;
			display: flex;
			box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
			margin-bottom: 16px;
		}

		.notesInput {
			margin: 0px;
		}

		@-webkit-keyframes fadeIn {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}

		.btnOutput {
			display: none;
			width: 100%;
			height: 50rem;
			white-space: pre-wrap;
		}
	</style>
	<body>
		<input id="json-input" placeholder="JSON String" />
		<button id="add-btn" onclick="importJSON()">Import</button>
		<button
			id="add-btn"
			onclick="generateJSON()"
			style="
				float: right;
				margin-right: 0px;
				background-color: rgba(79, 70, 229);
				color: white;
			">
			Generate JSON
		</button>
		<button
			id="add-btn"
			onclick="generateBBCode()"
			style="
				float: right;
				margin-right: 16px;
				background-color: rgb(70, 120, 229);
				color: white;
			">
			Generate BBCode
		</button>

		<div id="output"></div>
		<textarea id="btnOutput" class="btnOutput"></textarea>
		<script src="index.js" defer></script>
	</body>
</html>
